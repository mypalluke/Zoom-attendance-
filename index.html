<html lang="en">

      }

        margin: 0 !important;
        padding: 0 !important;
        background-color: white !important;
        color: black !important;
        font-size: 9px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        overflow: hidden !important;
      }

      .no-print {
        display: none !important;
      }

      main {
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .sheet-container {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        transform-origin: top center;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
      }

      .group-table th, .group-table td {
        padding: 0px 3px !important;
        font-size: 8.8px !important;
        line-height: 1.1 !important;
        height: 15px !important;
      }

      .group-header-1 {
        font-size: 9.5px !important;
        padding: 1px 3px !important;
        background-color: #1e293b !important;
      }

      .group-header-2 {
        font-size: 8.5px !important;
        padding: 1px 3px !important;
        background-color: #475569 !important;
      }

      input {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
        outline: none !important;
      }

      .check-cell {
        background-color: transparent !important;
      }

      .bg-emerald-100\/80 {
        background-color: #e6f4ea !important;
      }

      .ruled-line {
        height: 16px !important;
      }

      .role-badge {
        font-size: 7.5px !important;
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
      }

      .even-row {
        background-color: #f8fafc !important;
      }
    }

    /* Standard Table Styling for Screen */
    .group-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .group-table th, .group-table td {
      border: 1px solid #cbd5e1;
      padding: 1.5px 4px;
      font-size: 11px;
      line-height: 1.15;
      height: 18px;
    }

    .comfortable-mode .group-table th, 
    .comfortable-mode .group-table td {
      font-size: 12px;
      height: 20px;
      padding: 2px 5px;
    }

    .group-header-1 {
      background-color: #1e293b !important; /* Slate 800 */
      color: white !important;
      font-weight: 700;
      font-size: 11.5px;
      text-align: left;
      padding: 2.5px 5px !important;
      letter-spacing: 0.02em;
    }

    .group-header-2 {
      background-color: #475569 !important; /* Slate 600 */
      color: white !important;
      font-weight: 600;
      font-size: 10.5px;
      text-align: left;
      padding: 2px 5px !important;
    }

    .faded-text {
      color: #94a3b8;
    }

    .check-cell {
      width: 24px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .check-mark {
      font-weight: 800;
      font-size: 13px;
      color: #047857;
    }

    .ruled-line {
      border-bottom: 1px solid #cbd5e1;
      height: 19px;
    }

    .role-badge {
      font-size: 8.5px;
      font-weight: 600;
      color: #475569;
      background-color: #f1f5f9;
      padding: 0.5px 3px;
      border-radius: 2px;
      display: inline-block;
      line-height: 1;
    }

    .even-row {
      background-color: #f8fafc;
    }

    .search-match {
      background-color: #fef08a !important; /* Yellow-200 highlight */
      color: #000 !important;
      font-weight: bold;
    }

    /* Button effects */
    .btn-action {
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      transform: translateY(-1px);

<body class="bg-slate-100 min-h-screen text-slate-900 font-sans">

  <!-- Control Toolbar (Hidden in Print) -->
  <header class="no-print bg-slate-900 text-white shadow-md py-2.5 px-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-clipboard-user text-xl text-emerald-400"></i>
        <div>
          <h1 class="font-bold text-base leading-tight">Attendance Sheet Generator</h1>
          <p class="text-[11px] text-slate-300">Zoom Total = Checkmarks + Extra Attendees • In-Person is manual</p>
        </div>
      </div>

      <!-- Quick Finder / Search Bar -->
      <div class="relative flex-1 max-w-xs mx-2">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
        <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Find name on sheet..." 
          class="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-full pl-8 pr-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-400 placeholder-slate-400">
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button onclick="toggleLegibilityMode()" id="toggle-size-btn" class="btn-action bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5 shadow" title="Toggle larger text for mobile viewing">
          <i class="fa-solid fa-text-height text-emerald-400"></i> Size: Normal
        </button>
        <button onclick="loadSampleData()" class="btn-action bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-file-signature"></i> Load Sample
        </button>
        <button onclick="clearAllChecks()" class="btn-action bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-rotate-left"></i> Clear All
        </button>
        <button onclick="openExtraModal()" class="btn-action bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-user-plus"></i> Add Extra Person
        </button>
        <button onclick="window.print()" class="btn-action bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-lg">
          <i class="fa-solid fa-print"></i> Print Sheet
        </button>
      </div>
    </div>
  </header>

  <!-- Main Sheet Container -->
  <main class="py-4 px-2 sm:px-4 flex justify-center">
    <div id="sheet-card" class="sheet-container bg-white shadow-xl border border-slate-300 p-3.5 rounded-sm w-full max-w-[1040px]">
      
      <!-- Top Row: Groups 1, 2, 3 -->
      <div class="grid grid-cols-3 gap-2.5 mb-2.5">
        <!-- Group 1 -->
        <div id="group-container-1"></div>
        <!-- Group 2 -->
        <div id="group-container-2"></div>
        <!-- Group 3 -->
        <div id="group-container-3"></div>
      </div>

      <!-- Bottom Row: Groups 4, 5, 6 + Extra Area & Summary -->
      <div class="grid grid-cols-12 gap-2.5">
        <!-- Group 4 (Cols 1..4) -->
        <div class="col-span-4" id="group-container-4"></div>

        <!-- Group 5 (Cols 5..8) -->
        <div class="col-span-4" id="group-container-5"></div>

        <!-- Group 6 + Side Extra Section (Cols 9..12) -->
        <div class="col-span-4 flex flex-col justify-between">
          <div id="group-container-6"></div>

          <!-- Extra Attendees & Summary Section -->
          <div class="flex gap-2 mt-1.5 items-end">
            
            <!-- Extra People handwritten/typed area -->
            <div class="flex-1 border border-slate-400 p-1 bg-slate-50/50 rounded-sm min-h-[140px]">
              <div class="flex justify-between items-center mb-0.5 px-0.5 no-print">
                <span class="text-[9px] font-bold text-slate-700 uppercase tracking-wider">Extra Attendees (Zoom)</span>
                <button onclick="openExtraModal()" class="text-[9px] bg-blue-600 hover:bg-blue-700 text-white font-bold px-1.5 py-0.5 rounded shadow-sm">+ Add</button>
              </div>

              <div id="extra-attendees-list" class="space-y-0.5">
                <!-- Dynamic or Ruled lines -->
              </div>
            </div>

            <!-- Bottom Right Summary Box -->
            <div class="w-40 border-2 border-black p-1.5 bg-white shrink-0 shadow-sm">
              <div class="flex justify-between items-center border-b border-black pb-0.5 mb-0.5">
                <span class="font-bold text-xs text-slate-800">Date:</span>
                <input type="text" id="date-input" value="" placeholder="MM-DD-YY" class="w-20 text-right font-bold text-xs outline-none bg-transparent">
              </div>
              <div class="flex justify-between items-center border-b border-black pb-0.5 mb-0.5">
                <span class="font-bold text-xs text-slate-800">Zoom Total:</span>
                <input type="number" id="zoom-total" value="0" readonly class="w-14 text-right font-bold text-xs outline-none bg-transparent cursor-default text-emerald-700">
              </div>
              <div class="flex justify-between items-center border-b border-black pb-0.5 mb-0.5">
                <span class="font-bold text-xs text-slate-800">In-Person:</span>
                <input type="number" id="in-person-total" value="0" placeholder="0" class="w-14 text-right font-bold text-xs outline-none bg-transparent focus:bg-amber-50 rounded" oninput="calculateTotals()">
              </div>
              <div class="flex justify-between items-center pt-0.5 font-extrabold text-xs sm:text-sm text-slate-900">
                <span>Total:</span>
                <input type="number" id="grand-total" value="0" readonly class="w-16 text-right font-extrabold text-xs sm:text-sm outline-none bg-transparent cursor-default">
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Custom HTML Modal for Adding Extra Person -->
  <div id="extra-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden no-print">
    <div class="bg-white rounded-lg shadow-2xl p-5 w-full max-w-sm mx-4 border border-slate-200">
      <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-blue-600"></i> Add Extra Zoom Person
        </h3>
        <button onclick="closeExtraModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Attendee / Family Name</label>
          <input type="text" id="modal-name-input" placeholder="e.g. K. SINGLETARY or NIETO" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase font-semibold">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Number of People on Connection</label>
          <div class="flex items-center gap-3">
            <button type="button" onclick="adjustModalCount(-1)" class="w-10 h-10 rounded bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-lg flex items-center justify-center">-</button>
            <span id="modal-count-display" class="text-xl font-bold text-blue-700 w-12 text-center">1</span>
            <button type="button" onclick="adjustModalCount(1)" class="w-10 h-10 rounded bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-lg flex items-center justify-center">+</button>
            <span class="text-xs text-slate-500">person(s)</span>
          </div>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-2 pt-3 border-t border-slate-100">
        <button onclick="closeExtraModal()" class="px-4 py-2 rounded text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
        <button onclick="submitExtraModal()" class="px-4 py-2 rounded text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white shadow">Add to Zoom Total</button>
      </div>
    </div>
  </div>

    // Attendance & View State
    let attendanceState = {};
    let extraAttendees = [];
    let manualGroupTotals = {};
    let modalCountVal = 1;
    let searchQuery = '';

    function getFormattedCurrentDate() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const day = today.getDate();
      const year = today.getFullYear().toString().slice(-2);
      return `${month}-${day}-${year}`;
    }

    function init() {
      document.getElementById('date-input').value = getFormattedCurrentDate();
      renderSheet();
      calculateTotals();
    }

    function toggleLegibilityMode() {
      const card = document.getElementById('sheet-card');
      const btn = document.getElementById('toggle-size-btn');
      if (card.classList.contains('comfortable-mode')) {
        card.classList.remove('comfortable-mode');
        btn.innerHTML = `<i class="fa-solid fa-text-height text-emerald-400"></i> Size: Normal`;
      } else {
        card.classList.add('comfortable-mode');
        btn.innerHTML = `<i class="fa-solid fa-text-height text-amber-400"></i> Size: Large`;
      }
    }

    function handleSearch(query) {
      searchQuery = query.toLowerCase().trim();
      renderSheet();
    }

    function renderSheet() {
      groupData.forEach(group => {
        const container = document.getElementById(`group-container-${group.id}`);
        if (!container) return;

        let rowsHtml = '';
        let groupCheckedCount = 0;

        group.members.forEach((m, idx) => {
          const key = `g${group.id}_m${idx}`;
          const isChecked = !!attendanceState[key];
          if (isChecked) groupCheckedCount++;

          const fullName = `${m.firstName} ${m.lastName}`.toLowerCase();
          const isMatched = searchQuery !== '' && fullName.includes(searchQuery);

          const role1Html = m.role1 ? `<span class="role-badge">${m.role1}</span>` : '';
          const role2Html = m.role2 ? `<span class="role-badge">${m.role2}</span>` : '';

          const rowShading = isChecked 
            ? 'bg-emerald-100/80 hover:bg-emerald-200/80' 
            : (idx % 2 === 1 ? 'even-row hover:bg-slate-100' : 'hover:bg-slate-100');

          rowsHtml += `
            <tr class="${m.faded ? 'faded-text' : ''} ${rowShading} ${isMatched ? 'search-match' : ''} transition-colors cursor-pointer" onclick="toggleCheck(${group.id}, ${idx})">
              <td class="text-left font-semibold overflow-hidden whitespace-nowrap px-1">${m.firstName}</td>
              <td class="text-left overflow-hidden whitespace-nowrap px-1">${m.lastName}</td>
              <td class="text-center overflow-hidden whitespace-nowrap px-0.5">${role1Html}</td>
              <td class="text-center overflow-hidden whitespace-nowrap px-0.5">${role2Html}</td>
              <td class="check-cell">
                ${isChecked ? '<span class="check-mark">✓</span>' : ''}
              </td>
            </tr>
          `;
        });

        // Fill empty rows to maintain exact sheet proportions
        const emptyRowsNeeded = Math.max(0, group.targetRows - group.members.length);
        for (let i = 0; i < emptyRowsNeeded; i++) {
          const emptyRowShading = (group.members.length + i) % 2 === 1 ? 'even-row' : '';
          rowsHtml += `
            <tr class="${emptyRowShading}">
              <td>&nbsp;</td>
              <td>&nbsp;</td>
              <td>&nbsp;</td>
              <td>&nbsp;</td>
              <td class="check-cell">&nbsp;</td>
            </tr>
          `;
        }

        const displayTotal = manualGroupTotals[group.id] !== undefined ? manualGroupTotals[group.id] : (groupCheckedCount || '');

        container.innerHTML = `
          <table class="group-table shadow-sm">
            <thead>
              <tr>
                <th colspan="5" class="group-header-1">${group.title}</th>
              </tr>
              <tr>
                <th colspan="5" class="group-header-2">${group.subtitle}</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
            <tfoot>
              <tr class="font-bold bg-slate-100/90">
                <td colspan="4" class="text-left px-1.5 border border-slate-400 text-slate-800">Group Total:</td>
                <td class="text-center border border-slate-400">
                  <input type="text" id="group-total-${group.id}" value="${displayTotal}" onchange="setManualTotal(${group.id}, this.value)" class="w-full text-center font-extrabold outline-none bg-transparent">
                </td>
              </tr>
            </tfoot>
          </table>
        `;
      });

      renderExtraAttendees();
    }

    function toggleCheck(groupId, memberIdx) {
      const key = `g${groupId}_m${memberIdx}`;
      attendanceState[key] = !attendanceState[key];
      delete manualGroupTotals[groupId];
      renderSheet();
      calculateTotals();
    }

    function renderExtraAttendees() {
      const container = document.getElementById('extra-attendees-list');
      if (!container) return;

      const maxLines = 7;

      if (extraAttendees.length === 0) {
        let emptyLines = '';
        for (let i = 0; i < maxLines; i++) {
          emptyLines += `<div class="ruled-line"></div>`;
        }
        container.innerHTML = emptyLines;
        return;
      }

      let html = '';
      extraAttendees.forEach((person, idx) => {
        html += `
          <div class="flex items-center justify-between text-xs py-0.5 border-b border-slate-300">
            <span class="font-semibold uppercase tracking-wide text-[10px] sm:text-xs text-slate-800">
              ${person.name} ${person.count > 1 ? `<span class="font-extrabold text-blue-800 ml-1">- ${person.count}</span>` : ''}
            </span>
            <div class="flex items-center gap-1 no-print">
              <button onclick="stepExtraCount(${idx}, -1)" title="Decrease count" class="w-4 h-4 rounded bg-slate-200 hover:bg-slate-300 text-slate-700 text-[10px] font-bold flex items-center justify-center">-</button>
              <span class="text-[10px] font-bold text-slate-700 px-0.5">${person.count}</span>
              <button onclick="stepExtraCount(${idx}, 1)" title="Increase count" class="w-4 h-4 rounded bg-slate-200 hover:bg-slate-300 text-slate-700 text-[10px] font-bold flex items-center justify-center">+</button>
              <button onclick="removeExtraAttendee(${idx})" title="Remove attendee" class="text-rose-500 hover:text-rose-700 text-[10px] ml-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });

      const fillCount = Math.max(0, maxLines - extraAttendees.length);
      for (let i = 0; i < fillCount; i++) {
        html += `<div class="ruled-line"></div>`;
      }

      container.innerHTML = html;
    }

    /* Modal Dialog Functions */
    function openExtraModal() {
      modalCountVal = 1;
      document.getElementById('modal-name-input').value = '';
      document.getElementById('modal-count-display').innerText = '1';
      document.getElementById('extra-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modal-name-input').focus(), 100);
    }

    function closeExtraModal() {
      document.getElementById('extra-modal').classList.add('hidden');
    }

    function adjustModalCount(delta) {
      modalCountVal = Math.max(1, modalCountVal + delta);
      document.getElementById('modal-count-display').innerText = modalCountVal;
    }

    function submitExtraModal() {
      const nameInput = document.getElementById('modal-name-input').value;
      if (!nameInput || !nameInput.trim()) {
        closeExtraModal();
        return;
      }

      extraAttendees.push({
        name: nameInput.trim().toUpperCase(),
        count: modalCountVal
      });

      closeExtraModal();
      renderExtraAttendees();
      calculateTotals();
    }

    function stepExtraCount(idx, delta) {
      if (extraAttendees[idx]) {
        extraAttendees[idx].count = Math.max(1, extraAttendees[idx].count + delta);
        renderExtraAttendees();
        calculateTotals();
      }
    }

    function removeExtraAttendee(idx) {
      extraAttendees.splice(idx, 1);
      renderExtraAttendees();
      calculateTotals();
    }

    function setManualTotal(groupId, val) {
      if (val === '') {
        delete manualGroupTotals[groupId];
      } else {
        manualGroupTotals[groupId] = val;
      }
      calculateTotals();
    }

    function calculateTotals() {
      let groupChecksTotal = 0;

      groupData.forEach(group => {
        let groupChecked = 0;
        group.members.forEach((m, idx) => {
          if (attendanceState[`g${group.id}_m${idx}`]) {
            groupChecked++;
          }
        });

        const effectiveTotal = manualGroupTotals[group.id] !== undefined ? (parseInt(manualGroupTotals[group.id]) || 0) : groupChecked;
        
        const groupInput = document.getElementById(`group-total-${group.id}`);
        if (groupInput && manualGroupTotals[group.id] === undefined) {
          groupInput.value = groupChecked || '';
        }

        groupChecksTotal += effectiveTotal;
      });

      let extraCountTotal = 0;
      extraAttendees.forEach(p => {
        extraCountTotal += (p.count || 1);
      });

      // Zoom Total = Checkmarks + Extra Attendees
      const finalZoomTotal = groupChecksTotal + extraCountTotal;
      document.getElementById('zoom-total').value = finalZoomTotal;

      // In-person attendance is manually entered
      const inPersonVal = parseInt(document.getElementById('in-person-total').value) || 0;

      // Grand Total = Zoom Total + In-Person Total
      document.getElementById('grand-total').value = finalZoomTotal + inPersonVal;
    }

    function clearAllChecks() {
      attendanceState = {};
      extraAttendees = [];
      manualGroupTotals = {};
      document.getElementById('search-input').value = '';
      searchQuery = '';
      document.getElementById('date-input').value = getFormattedCurrentDate();
      document.getElementById('in-person-total').value = '0';
      renderSheet();
      calculateTotals();
    }
