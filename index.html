<!DOCTYPE html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Sheet - Group Summary</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      @page {
        size: letter portrait;
        margin: 0.15in;
      }
      
      html, body {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background-color: white !important;
        color: black !important;
        font-size: 9.5px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        overflow: hidden !important;
      }

      .no-print {
        display: none !important;
      }

      main {
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .sheet-container {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        transform-origin: top center;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
      }

      .group-table th, .group-table td {
        padding: 0px 2px !important;
        font-size: 9px !important;
        line-height: 1.1 !important;
        height: 15.5px !important;
      }

      .group-header-1 {
        font-size: 10px !important;
        padding: 1.5px 3px !important;
      }

      .group-header-2 {
        font-size: 9px !important;
        padding: 1px 3px !important;
      }

      input {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
        outline: none !important;
      }

      .check-cell {
        background-color: transparent !important;
      }

      .bg-emerald-50 {
        background-color: transparent !important;
      }

      .ruled-line {
        height: 17px !important;
      }
    }

    /* Standard Table Styling for Screen */
    .group-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      font-family: Arial, Helvetica, sans-serif;
    }

    .group-table th, .group-table td {
      border: 1px solid #333333;
      padding: 1px 3px;
      font-size: 10.5px;
      line-height: 1.15;
      height: 17.5px;
    }

    .group-header-1 {
      background-color: #4a4a4a !important;
      color: white !important;
      font-weight: bold;
      font-size: 11px;
      text-align: left;
      padding: 2px 4px !important;
    }

    .group-header-2 {
      background-color: #666666 !important;
      color: white !important;
      font-weight: bold;
      font-size: 10px;
      text-align: left;
      padding: 1.5px 4px !important;
    }

    .faded-text {
      color: #888888;
    }

    .check-cell {
      width: 24px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .check-mark {
      font-weight: bold;
      font-size: 13px;
      color: #000000;
    }

    .ruled-line {
      border-bottom: 1px solid #444;
      height: 20px;
    }

    /* Button effects */
    .btn-action {
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-900 font-sans">

          <i class="fa-solid fa-print"></i> Print Sheet
        </button>
      </div>
    </div>
  </header>

  <!-- Main Sheet Container -->
  <main class="py-4 px-2 sm:px-4 flex justify-center">
    <div class="sheet-container bg-white shadow-xl border border-gray-300 p-3 rounded-sm w-full max-w-[1020px]">
      
      <!-- Top Row: Groups 1, 2, 3 -->
      <div class="grid grid-cols-3 gap-2 mb-2">
        <!-- Group 1 -->
        <div id="group-container-1"></div>
        <!-- Group 2 -->
        <div id="group-container-2"></div>
        <!-- Group 3 -->
        <div id="group-container-3"></div>
      </div>

      <!-- Bottom Row: Groups 4, 5, 6 + Extra Area & Summary -->
      <div class="grid grid-cols-12 gap-2">
        <!-- Group 4 (Cols 1..4) -->
        <div class="col-span-4" id="group-container-4"></div>

        <!-- Group 5 (Cols 5..8) -->
        <div class="col-span-4" id="group-container-5"></div>

        <!-- Group 6 + Side Extra Section (Cols 9..12) -->
        <div class="col-span-4 flex flex-col justify-between">
          <div id="group-container-6"></div>

          <!-- Extra Attendees & Summary Section -->
          <div class="flex gap-2 mt-1.5 items-end">
            
            <!-- Extra People handwritten/typed area -->
            <div class="flex-1 border border-gray-500 p-1 bg-gray-50/50 rounded-sm min-h-[140px]">
              <div class="flex justify-between items-center mb-0.5 no-print">
                <span class="text-[9px] font-bold text-gray-700 uppercase tracking-wider">Extra Attendees (Zoom)</span>
                <button onclick="addExtraAttendeePrompt()" class="text-[9px] text-blue-600 font-bold hover:underline">+ Add</button>
              </div>

              <div id="extra-attendees-list" class="space-y-0.5">
                <!-- Dynamic or Ruled lines -->
              </div>
            </div>

            <!-- Bottom Right Summary Box -->
            <div class="w-40 border-2 border-black p-1 bg-white shrink-0">
              <div class="flex justify-between items-center border-b border-black pb-0.5 mb-0.5">
                <span class="font-bold text-xs">Date:</span>
                <input type="text" id="date-input" value="" placeholder="MM-DD-YY" class="w-20 text-right font-bold text-xs outline-none bg-transparent">
              </div>
              <div class="flex justify-between items-center border-b border-black pb-0.5 mb-0.5">
                <span class="font-bold text-xs">Zoom Total:</span>
                <input type="number" id="zoom-total" value="0" readonly class="w-14 text-right font-bold text-xs outline-none bg-transparent cursor-default text-emerald-700">
              </div>
              <div class="flex justify-between items-center border-b border-black pb-0.5 mb-0.5">
                <span class="font-bold text-xs">In-Person:</span>
                <input type="number" id="in-person-total" value="0" placeholder="0" class="w-14 text-right font-bold text-xs outline-none bg-transparent focus:bg-amber-50 rounded" oninput="calculateTotals()">
              </div>
              <div class="flex justify-between items-center pt-0.5 font-extrabold text-xs sm:text-sm">
                <span>Total:</span>
                <input type="number" id="grand-total" value="0" readonly class="w-16 text-right font-extrabold text-xs sm:text-sm outline-none bg-transparent cursor-default">
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>

    function getFormattedCurrentDate() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const day = today.getDate();
      const year = today.getFullYear().toString().slice(-2);
      return `${month}-${day}-${year}`;
    }

    function init() {
      document.getElementById('date-input').value = getFormattedCurrentDate();
      renderSheet();
      calculateTotals();
    }

    function renderSheet() {
      groupData.forEach(group => {
        const container = document.getElementById(`group-container-${group.id}`);
        if (!container) return;

        let rowsHtml = '';
        let groupCheckedCount = 0;

        group.members.forEach((m, idx) => {
          const key = `g${group.id}_m${idx}`;
          const isChecked = !!attendanceState[key];
          if (isChecked) groupCheckedCount++;

          rowsHtml += `
            <tr class="${m.faded ? 'faded-text' : ''} ${isChecked ? 'bg-emerald-50' : ''} transition-colors cursor-pointer" onclick="toggleCheck(${group.id}, ${idx})">
              <td class="text-left font-medium overflow-hidden whitespace-nowrap">${m.firstName}</td>
              <td class="text-left overflow-hidden whitespace-nowrap">${m.lastName}</td>
              <td class="text-center text-[9.5px] overflow-hidden whitespace-nowrap">${m.role1 || ''}</td>
              <td class="text-center text-[9.5px] overflow-hidden whitespace-nowrap">${m.role2 || ''}</td>
              <td class="check-cell">
                ${isChecked ? '<span class="check-mark">✓</span>' : ''}
              </td>
            </tr>
          `;
        });

        // Fill empty rows to maintain exact sheet proportions
        const emptyRowsNeeded = Math.max(0, group.targetRows - group.members.length);
        for (let i = 0; i < emptyRowsNeeded; i++) {
          rowsHtml += `
            <tr>
              <td>&nbsp;</td>
              <td>&nbsp;</td>
              <td>&nbsp;</td>
              <td>&nbsp;</td>
              <td class="check-cell">&nbsp;</td>
            </tr>
          `;
        }

        const displayTotal = manualGroupTotals[group.id] !== undefined ? manualGroupTotals[group.id] : (groupCheckedCount || '');

        container.innerHTML = `
          <table class="group-table">
            <thead>
              <tr>
                <th colspan="5" class="group-header-1">${group.title}</th>
              </tr>
              <tr>
                <th colspan="5" class="group-header-2">${group.subtitle}</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
            <tfoot>
              <tr class="font-bold bg-gray-50">
                <td colspan="4" class="text-left px-1.5 border border-gray-700">Group Total:</td>
                <td class="text-center border border-gray-700">
                  <input type="text" id="group-total-${group.id}" value="${displayTotal}" onchange="setManualTotal(${group.id}, this.value)" class="w-full text-center font-bold outline-none bg-transparent">
                </td>
              </tr>
            </tfoot>
          </table>
        `;
      });

      renderExtraAttendees();
    }

    function toggleCheck(groupId, memberIdx) {
      const key = `g${groupId}_m${memberIdx}`;
      attendanceState[key] = !attendanceState[key];
      
      // Reset manual override for group total if user clicks checks
      delete manualGroupTotals[groupId];
      
      renderSheet();
      calculateTotals();
    }

    function renderExtraAttendees() {
      const container = document.getElementById('extra-attendees-list');
      if (!container) return;

      const maxLines = 7;

      if (extraAttendees.length === 0) {
        let emptyLines = '';
        for (let i = 0; i < maxLines; i++) {
          emptyLines += `<div class="ruled-line"></div>`;
        }
        container.innerHTML = emptyLines;
        return;
      }

      let html = '';
      extraAttendees.forEach((person, idx) => {
        html += `
          <div class="flex items-center justify-between text-xs py-0.5 border-b border-gray-400">
            <span class="font-semibold uppercase tracking-wide text-[10px] sm:text-xs">
              ${person.name} ${person.count > 1 ? `<span class="font-bold text-blue-700 ml-1">- ${person.count}</span>` : ''}
            </span>
            <div class="flex items-center gap-1 no-print">
              <button onclick="editExtraAttendeeCount(${idx})" title="Edit person count" class="text-gray-500 hover:text-blue-600 text-[10px] px-1"><i class="fa-solid fa-pen"></i></button>
              <button onclick="removeExtraAttendee(${idx})" title="Remove attendee" class="text-red-500 hover:text-red-700 text-[10px] px-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });

      // Fill remaining space with ruled lines if less than maxLines
      const fillCount = Math.max(0, maxLines - extraAttendees.length);
      for (let i = 0; i < fillCount; i++) {
        html += `<div class="ruled-line"></div>`;
      }

      container.innerHTML = html;
    }

    function addExtraAttendeePrompt() {
      const name = prompt("Enter extra Zoom attendee name (e.g., K. SINGLETARY, NIETO, etc.):");
      if (!name || !name.trim()) return;
      
      const countStr = prompt(`How many people are included on ${name.trim().toUpperCase()}'s connection? (e.g., 1, 2, 3):`, "1");
      const count = parseInt(countStr) || 1;

      extraAttendees.push({ name: name.trim().toUpperCase(), count: count });
      renderExtraAttendees();
      calculateTotals();
    }

    function editExtraAttendeeCount(idx) {
      const current = extraAttendees[idx];
      const newCountStr = prompt(`Update count for ${current.name}:`, current.count);
      if (newCountStr !== null) {
        const parsed = parseInt(newCountStr);
        if (!isNaN(parsed) && parsed > 0) {
          extraAttendees[idx].count = parsed;
          renderExtraAttendees();
          calculateTotals();
        }
      }
    }

    function removeExtraAttendee(idx) {
      extraAttendees.splice(idx, 1);
      renderExtraAttendees();
      calculateTotals();
    }

    function setManualTotal(groupId, val) {
      if (val === '') {
        delete manualGroupTotals[groupId];
      } else {
        manualGroupTotals[groupId] = val;
      }
      calculateTotals();
    }

    function calculateTotals() {
      let groupChecksTotal = 0;

      groupData.forEach(group => {
        let groupChecked = 0;
        group.members.forEach((m, idx) => {
          if (attendanceState[`g${group.id}_m${idx}`]) {
            groupChecked++;
          }
        });

        const effectiveTotal = manualGroupTotals[group.id] !== undefined ? (parseInt(manualGroupTotals[group.id]) || 0) : groupChecked;
        
        // Update input display for group total
        const groupInput = document.getElementById(`group-total-${group.id}`);
        if (groupInput && manualGroupTotals[group.id] === undefined) {
          groupInput.value = groupChecked || '';
        }

        groupChecksTotal += effectiveTotal;
      });

      // Calculate sum of Extra Attendees (e.g., 1, 2, 3 per entry)
      let extraCountTotal = 0;
      extraAttendees.forEach(p => {
        extraCountTotal += (p.count || 1);
      });

      // Zoom Total = Checkmarks + Extra Attendees
      const finalZoomTotal = groupChecksTotal + extraCountTotal;
      document.getElementById('zoom-total').value = finalZoomTotal;

      // In-person attendance is manually entered
      const inPersonVal = parseInt(document.getElementById('in-person-total').value) || 0;

      // Grand Total = Zoom Total + In-Person Total
      document.getElementById('grand-total').value = finalZoomTotal + inPersonVal;
    }

    function clearAllChecks() {
      attendanceState = {};
      extraAttendees = [];
      manualGroupTotals = {};
      document.getElementById('date-input').value = getFormattedCurrentDate();
      document.getElementById('in-person-total').value = '0';
      renderSheet();
      calculateTotals();
    }

    // Initialize on load
    window.onload = init;
  </script>
